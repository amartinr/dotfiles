#################################
#          Shadows              #
#################################
shadow = true;
no-dock-shadow = true;
no-dnd-shadow = true;

# Excluir sombras de ventanas ocultas y rofi
shadow-exclude = [
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
  "!I3_FLOATING_WINDOW@:c && !_NET_WM_NAME@:s *?= 'rofi'"
];

#################################
#       Inactive Dimming        #
#################################
inactive-dim = 0.1;
inactive-dim-fixed = true;

#################################
#       Window Type Settings    #
#################################

detect-transient = true;
detect-client-leader = true;

#################################
#       Backend Settings        #
#################################

backend = "xrender";
vsync = true;

#################################
#       Opacity Rules (opcional)
#################################
# opacity-rule = ["100:_NET_WM_NAME@:s = 'rofi'"];

